# Abogao – sitio estático en EC2 con Nginx
# Copiar a /etc/nginx/sites-available/abogao y enlazar en sites-enabled.
# Cambia abogao.tudominio.co por tu dominio. El certificado lo genera certbot (ver README).
# IMPORTANTE: la ubicación y el micrófono del navegador SOLO funcionan con HTTPS.

server {
    listen 80;
    server_name abogao.tudominio.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name abogao.tudominio.co;

    ssl_certificate     /etc/letsencrypt/live/abogao.tudominio.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abogao.tudominio.co/privkey.pem;

    root /var/www/abogao;
    index index.html;

    # Permisos del navegador: ubicación, micrófono y cámara solo para este sitio y Jitsi
    add_header Permissions-Policy "geolocation=(self), microphone=(self "https://meet.jit.si"), camera=(self \"https://meet.jit.si\")" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Política de seguridad de contenido: solo se ejecuta código de este dominio; Jitsi solo como iframe y su script.
    # Si activas la IA por proxy, queda dentro de 'self'. Ajusta los mosaicos si cambias de proveedor de mapas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://meet.jit.si; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; frame-src https://meet.jit.si; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS y CSS: caché corta mientras el proyecto cambia seguido
    location ~* \.(js|css)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # El service worker y el manifiesto no se guardan en caché: así los celulares ven cada versión nueva
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # Librerías con versión fija: caché larga
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No servir la carpeta .git si se clona el repo directamente en el root
    location ~ /\.git { deny all; }

    # Futuro proxy de IA (la clave de Gemini vive en el servidor).
    # Cuando exista el servicio, descomenta y define aiEndpoint: '/api/clasificar' en js/config.js
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header Host $host;
    #     client_max_body_size 5m;   # notas de voz de hasta 60 s
    # }
}
